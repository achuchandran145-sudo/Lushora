name: LUSHORA CI
on:
  push:
    branches: [main, chandran-work, lushora-premium-v2]
  pull_request:
    branches: [main, chandran-work]
jobs:
  backend-tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install backend requirements
        run: pip install -r backend/requirements.txt
      - name: Install Chromium for browser E2E
        run: python -m playwright install --with-deps chromium
      - name: Validate operational scripts
        working-directory: backend
        run: bash -n scripts/migrate_production.sh scripts/backup_postgres.sh scripts/restore_verify_postgres.sh
      - name: Audit Python dependencies
        run: pip install pip-audit && pip-audit -r backend/requirements.txt
      - name: Run backend tests
        working-directory: backend
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        run: pytest -q
  frontend-build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Audit npm dependencies
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: Build frontend
        working-directory: frontend
        run: npm run build
